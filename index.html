<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק אלתור</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background-container" class="background-container"></div>
    <div class="background-overlay"></div>

    <header>
        <img id="logo-img" src="images/logo.jpg" alt="Logo" class="logo">
        <h1 id="game-title">משחק אלתור</h1>
        <p id="game-subtitle" class="subtitle">סרקו את קוד ה־QR והקשיבו לשיר בנגן</p>
    </header>

    <main>
        <div class="player-box">
            <p id="prompt-text" class="prompt-text">לחצו על Play:</p>      
            <p id="prompt-text" class="prompt-text">והקשיבו היטב לשיר בנגן:</p>
            <div id="player-content">
                <div class="message-box">טוען שיר אקראי...</div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
